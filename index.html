<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StarShot · StarShot</title>
    <style>
:root {
  color-scheme: light dark;
  --bg: #0b1019;
  --text: #f5f4f1;
  --muted: #b8b4ad;
  --line: rgba(245, 244, 241, 0.14);
  --accent: #d4a574;
  --link: #f0c88e;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(circle at 20% 0%, rgba(212, 165, 116, 0.14), transparent 34%), linear-gradient(180deg, #0b1019 0%, #090b10 100%);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
  line-height: 1.72;
}
.shell { width: min(880px, calc(100% - 40px)); margin: 0 auto; padding: 32px 0 56px; }
nav { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.brand { font-size: 18px; font-weight: 700; color: var(--text); text-decoration: none; }
.links { display: flex; gap: 14px; flex-wrap: wrap; }
a { color: var(--link); }
.links a { color: var(--muted); text-decoration: none; font-size: 14px; }
.links a:hover { color: var(--accent); }
main { padding-top: 28px; }
h1, h2, h3, h4 { line-height: 1.25; letter-spacing: 0; }
h1 { font-size: clamp(32px, 6vw, 52px); margin: 0 0 18px; }
h2 { margin-top: 42px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--accent); }
h3 { margin-top: 28px; }
p, li { color: var(--muted); }
strong { color: var(--text); }
code { color: var(--text); background: rgba(255, 255, 255, 0.08); padding: 2px 5px; border-radius: 5px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
footer { margin-top: 44px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
@media (max-width: 640px) {
  .shell { width: min(100% - 28px, 880px); padding-top: 22px; }
  nav { align-items: flex-start; flex-direction: column; }
}
</style>
  </head>
  <body>
    <div class="shell">
      <nav>
        <a class="brand" href="/StarShot-Privacy/">StarShot 星拍助手</a>
        <div class="links">

          <a href="/StarShot-Privacy/support/">支持中心</a>
        </div>
      </nav>
      <main>
<h1>StarShot 星拍助手</h1>

<ul>

    </div>
  </body>
</html>
